; Racing Driver Helmet Biometric Monitor
;
;   pio run                 build the firmware
;   pio run -t upload       flash it
;   pio device monitor      watch the serial output (115200 baud)
;   pio test -e native      run the unit tests on your PC (needs a host C++ compiler)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    adafruit/Adafruit MMA8451 Library@1.2.3
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
; Lets `pio test -e esp32dev` build the tests against src/ for on-device runs.
test_build_src = yes

; Desktop build of the hardware-independent logic in src/core/ only.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags = -std=gnu++11 -Wall -Wextra -I src
